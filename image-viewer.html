<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Viewer</title>
  <style>
    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .viewer-card {
      width: min(100%, 1100px);
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.16);
      padding: 20px;
      text-align: center;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 80vh;
      object-fit: contain;
      margin: 0 auto 16px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }

    .back-btn {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 8px;
      background: #005A9C;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }

    .back-btn:hover {
      background: #00467a;
    }
  </style>
</head>
<body>
  <div class="viewer-card">
    <img id="imageView" alt="Selected image" />
    <a id="backLink" class="back-btn" href="#">Back</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const imageName = params.get("image");
    const returnUrl = params.get("return");
    const imageElement = document.getElementById("imageView");
    const backLink = document.getElementById("backLink");
    const targetUrl = decodeURIComponent(returnUrl || "./store.html?store=10");

    if (imageName) {
      imageElement.src = `./${imageName}`;
      imageElement.alt = imageName;
    }

    backLink.href = targetUrl;
    backLink.addEventListener("click", (event) => {
      event.preventDefault();
      window.location.href = targetUrl;
    });
  </script>
</body>
</html>
