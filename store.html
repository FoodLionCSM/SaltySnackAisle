<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <base href="./">
    <title>Store Viewer</title>
</head>
<body>
    <div class="page-shell">
        <div class="content-card">
            <h1 id="storeTitle"></h1>
            <p id="storeMessage" class="store-message"></p>
            <div class="image-section">
                <a id="storeImageLink" href="#" rel="noopener noreferrer" style="display:none; text-decoration:none;">
                    <img id="storeImage" alt="Store image">
                </a>
                <a id="nineFootLink" class="section-link" href="./image-viewer.html?image=Store109ft.png&return=store.html%3Fstore%3D10" rel="noopener noreferrer" style="display:none;">9ft</a>
                <a id="fiveFootLink" class="section-link" href="./image-viewer.html?image=Store105ft.png&return=store.html%3Fstore%3D10" rel="noopener noreferrer" style="display:none;">5ft</a>
                <a id="twentyoneFootLink" class="section-link" href="./image-viewer.html?image=Store1021ft.png&return=store.html%3Fstore%3D10" rel="noopener noreferrer" style="display:none;">21ft</a>
                <a id="eighteenFootLink" class="section-link" href="./image-viewer.html?image=Store1018ft.png&return=store.html%3Fstore%3D10" rel="noopener noreferrer" style="display:none;">18ft</a>
                <a id="twentyfourFootLink" class="section-link" href="./image-viewer.html?image=Store1024ft.png&return=store.html%3Fstore%3D10" rel="noopener noreferrer" style="display:none;">24ft</a>
                <a id="sevenFootLink" class="section-link" href="./image-viewer.html?image=Store107ft.png&return=store.html%3Fstore%3D10" rel="noopener noreferrer" style="display:none;">7ft</a>
                <a id="fourFootLink" class="section-link" href="./image-viewer.html?image=Store104ft.png&return=store.html%3Fstore%3D10" rel="noopener noreferrer" style="display:none;">4ft</a>
                <a id="elevenFootLink" class="section-link" href="./image-viewer.html?image=Store1011ft.png&return=store.html%3Fstore%3D10" rel="noopener noreferrer" style="display:none;">11ft</a>
                <a id="eightFootLink" class="section-link" href="./image-viewer.html?image=Store108ft.png&return=store.html%3Fstore%3D10" rel="noopener noreferrer" style="display:none;">8ft</a>
                <a id="eightFootLinkAlt" class="section-link" href="./image-viewer.html?image=Store108ft.png&return=store.html%3Fstore%3D10" rel="noopener noreferrer" style="display:none;">8ft</a>
                <a id="twoFootLink" class="section-link" href="./image-viewer.html?image=Store102ft.png&return=store.html%3Fstore%3D10" rel="noopener noreferrer" style="display:none;">2ft</a>
                <a id="threeFootLink" class="section-link" href="./image-viewer.html?image=Store103ft.png&return=store.html%3Fstore%3D10" rel="noopener noreferrer" style="display:none;">3ft</a>
                <a id="twentyFootLink" class="section-link" href="./image-viewer.html?image=Store1020ft.png&return=store.html%3Fstore%3D10" rel="noopener noreferrer" style="display:none;">20ft</a>
                <a id="sixFootLink" class="section-link" href="./image-viewer.html?image=Store106ft.png&return=store.html%3Fstore%3D10" rel="noopener noreferrer" style="display:none;">6ft</a>
                <a id="seventeenFootLink" class="section-link" href="./image-viewer.html?image=Store1017ft.png&return=store.html%3Fstore%3D10" rel="noopener noreferrer" style="display:none;">17ft</a>
                <a id="nineteenFootLink" class="section-link" href="./image-viewer.html?image=Store1019ft.png&return=store.html%3Fstore%3D10" rel="noopener noreferrer" style="display:none;">19ft</a>
            </div>
            <button onclick="goBack()">Back to Store Finder</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
        background: #ffffff;
        color: #1f2937;
      }

      .page-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 16px 90px;
        box-sizing: border-box;
      }

      .content-card {
        background: #f3f4f6;
        border: 1px solid #d1d5db;
        border-radius: 16px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.16);
        padding: 24px;
        width: min(92%, 960px);
        text-align: center;
        position: relative;
      }

      h1 {
        margin: 0 0 16px;
        color: #005A9C;
        font-size: 1.8rem;
        font-weight: 700;
      }

      .store-message {
        margin: 0 0 16px;
        color: #111111;
        font-weight: 600;
        display: none;
      }

      #storeImage {
        display: block;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        border-radius: 12px;
        border: 1px solid #e5e7eb;
      }

      .image-section {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
      }

      .section-link {
        display: inline-block;
        padding: 3px 7px;
        border-radius: 6px;
        background: #005A9C;
        color: white;
        font-weight: 700;
        font-size: 0.8rem;
        line-height: 1.2;
        text-decoration: none;
        transition: background 0.2s ease;
      }

      .section-link:hover {
        background: #00467a;
      }

      @media (max-width: 480px) {
        .section-link {
          padding: 2px 6px;
          font-size: 0.72rem;
          border-radius: 5px;
        }
      }

      button {
        position: fixed;
        top: 12px;
        right: 12px;
        padding: 8px 12px;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        background: #005A9C;
        color: white;
        font-weight: 600;
        font-size: 0.9rem;
        transition: background 0.2s ease;
      }

      button:hover {
        background: #00467a;
      }

      img.bottom {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: auto;
        z-index: 9999;
      }
    </style>

    
    <img src="./updatedFLGraphicPNG.png"
         alt="Bottom Image"
         class="bottom">
</body>
</html>
